<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo sobre Mario</title>
    <link rel="stylesheet" href="/dist/output.css">

</head>

<body class="min-h-screen bg-white text-black antialiased">

    <article class="relative">

        <div class="grid max-w-6xl mx-auto grid-cols-2 items-center gap-10 px-6 pb-48 pt-16">
            <div class="space-y-5">
                <h1 class="text-7xl font-black tracking-tight text-black">Todo sobre<br>Mario</h1>
                <p class="text-2xl text-zinc-800">Conoce a Mario, el héroe con bigotes del Reino Champiñón...</p>
                
                <button class="bg-[#f7d51d] text-black font-black py-4 px-8 rounded-lg 
               border-b-8 border-r-8 border-[#b89c0a] 
               hover:translate-y-1 hover:border-b-4 hover:border-r-4 
               active:translate-y-2 active:border-b-0 active:border-r-0
               transition-all duration-75 uppercase tracking-tighter">
                    ¡Presiona Aquí!
                </button>
            </div>


            <div class="flex justify-end">
                <img class="w-[22rem] drop-shadow-2xl" src="img/mario-pole2.png" alt="Mario">
            </div>

        </div>

        <div class="absolute bottom-0 w-full h-48 bg-red-600 -z-10"></div>
    </article>

    <article class="relative bg-red-600 pb-16">

        <div class="grid max-w-6xl mx-auto grid-cols-[1.2fr_0.8fr] items-center gap-10 px-6">
            <div>
                <img class="h-[400px] w-full object-cover border-4 border-white shadow-2xl rounded-2xl"
                    src="img/mario-1.jpg" alt="Mario corriendo">
            </div>

            <div class="text-white">
                <h2 class="text-8xl font-black leading-[0.85] tracking-tight [text-shadow:0_6px_0_rgba(0,0,0,0.22)]">
                    Corre!<br>Acelera!<br>Salta!
                </h2>
                <p class="mt-5 text-sm font-semibold uppercase tracking-widest opacity-90">Aventura en cada nivel</p>
            </div>
        </div>
    </article>

</body>


</html>
